<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android TTS Test</title>
<style>
body{font-family:sans-serif;padding:32px;max-width:600px;margin:auto}
button{font-size:24px;padding:18px 24px}
#status{margin-top:20px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Android 音声テスト</h1>
<p>下のボタンを押してください。</p>
<button onclick="testSpeak()">🔊 英語音声をテスト</button>
<div id="status"></div>

<script>
function testSpeak(){
  var s=document.getElementById('status');
  s.textContent='音声再生を開始します…';

  if(!('speechSynthesis' in window)){
    s.textContent='このブラウザでは speechSynthesis が利用できません。';
    return;
  }

  try{
    window.speechSynthesis.cancel();

    var u=new SpeechSynthesisUtterance(
      'Hello. This is an English voice test.'
    );
    u.lang='en-US';
    u.rate=0.9;
    u.volume=1;

    u.onstart=function(){
      s.textContent='音声再生中です。';
    };
    u.onend=function(){
      s.textContent='音声再生が完了しました。';
    };
    u.onerror=function(e){
      s.textContent='音声エラー: '+(e.error || 'unknown');
    };

    window.speechSynthesis.speak(u);
  }catch(e){
    s.textContent='JavaScriptエラー: '+e.message;
  }
}
</script>
</body>
</html>
