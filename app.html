var questions=[];
var index=0;
var firstTryCorrect=0;
var correctionMode=false;
var currentHadMistake=false;
var currentGrade='4';
var canSpeak=('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);

var gradeSelect=document.getElementById('gradeSelect');
var startBtn=document.getElementById('startBtn');
var appArea=document.getElementById('appArea');
var input=document.getElementById('answerInput');
var feedback=document.getElementById('feedback');
var progress=document.getElementById('progress');
var score=document.getElementById('score');
var ttsStatus=document.getElementById('ttsStatus');

if(canSpeak){
  ttsStatus.textContent='音声読み上げ：利用できます';
}else{
  ttsStatus.textContent='音声読み上げ：このブラウザでは利用できません';
}

function shuffle(arr){
  var a=arr.slice();
  var i,j,t;
  for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function normalize(s){return String(s||'').replace(/^\s+|\s+$/g,'').toLowerCase();}

function getMacSamanthaVoice(){
  var ua=navigator.userAgent||'';
  var platform=navigator.platform||'';
  var isIOS=/iPad|iPhone|iPod/.test(ua) ||
            (platform==='MacIntel' && navigator.maxTouchPoints>1);
  var isMac=!isIOS && (/Macintosh|Mac OS X/.test(ua) || /Mac/.test(platform));
  if(!isMac || !window.speechSynthesis) return null;

  var voices=window.speechSynthesis.getVoices()||[];
  for(var i=0;i<voices.length;i++){
    if((voices[i].name||'').toLowerCase().indexOf('samantha')!==-1){
      return voices[i];
    }
  }
  return null;
}

var cachedMacSamantha=null;

function isMacDesktop(){
  var ua=navigator.userAgent||'';
  var platform=navigator.platform||'';
  var isIOS=/iPad|iPhone|iPod/.test(ua) ||
            (platform==='MacIntel' && navigator.maxTouchPoints>1);
  return !isIOS && (/Macintosh|Mac OS X/.test(ua) || /Mac/.test(platform));
}

function refreshMacVoice(){
  var v=getMacSamanthaVoice();
  if(v) cachedMacSamantha=v;
  return cachedMacSamantha;
}

if(window.speechSynthesis){
  try{ window.speechSynthesis.getVoices(); }catch(e){}
  if('onvoiceschanged' in window.speechSynthesis){
    window.speechSynthesis.addEventListener('voiceschanged', function(){
      refreshMacVoice();
    });
  }
}

function actuallySpeakCurrent(voice){
  if(!canSpeak || index>=questions.length) return;

  try{window.speechSynthesis.cancel();}catch(e){}

  var word=questions[index][0];
  var sentence=questions[index][1];

  function makeUtterance(text, rate){
    var u=new SpeechSynthesisUtterance(text);
    if(voice) u.voice=voice;
    u.lang='en-US';
    u.rate=rate;
    u.pitch=1.0;
    u.volume=1.0;
    u.onerror=function(){
      ttsStatus.textContent='音声を再生できませんでした。端末の読み上げ設定を確認してください。';
    };
    return u;
  }

  var u1=makeUtterance(word, 0.84);
  var u2=makeUtterance(sentence, 0.90);
  var u3=makeUtterance(word, 0.84);

  u1.onend=function(){
    window.setTimeout(function(){
      try{
        window.speechSynthesis.speak(u2);
      }catch(e){
        ttsStatus.textContent='音声を再生できませんでした。';
      }
    },600);
  };

  u2.onend=function(){
    window.setTimeout(function(){
      try{
        window.speechSynthesis.speak(u3);
      }catch(e){
        ttsStatus.textContent='音声を再生できませんでした。';
      }
    },600);
  };

  try{
    window.speechSynthesis.speak(u1);
  }catch(e){
    ttsStatus.textContent='音声を再生できませんでした。';
  }
}

function speakCurrent(){
  if(!canSpeak || index>=questions.length) return;

  if(!isMacDesktop()){
    actuallySpeakCurrent(null);
    return;
  }

  var voice=refreshMacVoice();
  if(voice){
    actuallySpeakCurrent(voice);
    return;
  }

  var tries=0;
  var timer=window.setInterval(function(){
    tries++;
    var v=refreshMacVoice();
    if(v || tries>=10){
      window.clearInterval(timer);
      actuallySpeakCurrent(v || null);
    }
  },100);
}

function updateStatus(){
  progress.textContent=(index+1)+' / '+questions.length;
  score.textContent='一発正解 '+firstTryCorrect;
}

function showQuestion(shouldSpeak){
  if(index>=questions.length){
    progress.textContent=questions.length+' / '+questions.length;
    feedback.innerHTML='<strong>終了！</strong><br>一発正解：'+firstTryCorrect+' / '+questions.length;
    input.disabled=true;
    return;
  }
  correctionMode=false;
  currentHadMistake=false;
  input.disabled=false;
  input.value='';
  feedback.textContent='';
  updateStatus();
  input.focus();
  if(shouldSpeak) speakCurrent();
}

function beginQuiz(){
  currentGrade=gradeSelect.value;
  questions=shuffle(grades[currentGrade] || grades['4']);
  index=0;firstTryCorrect=0;correctionMode=false;currentHadMistake=false;
  appArea.style.display='block';
  showQuestion(true);
}

function checkAnswer(){
  if(index>=questions.length) return;
  var typed=normalize(input.value);
  var word=questions[index][0];
  var correct=normalize(word);
  if(!typed) return;
  if(!correctionMode){
    if(typed===correct){
      firstTryCorrect++;
      feedback.innerHTML='✓ 正解！';
      input.disabled=true;
      updateStatus();
      window.setTimeout(function(){index++;showQuestion(true);},800);
    }else{
      currentHadMistake=true;
      correctionMode=true;
      feedback.innerHTML='不正解。正解は <span class="answer">'+word+'</span><br><span style="font-size:14px;color:#666">正解を見ながら、もう一度入力してください。</span>';
      input.value='';input.focus();
    }
  }else{
    if(typed===correct){
      feedback.innerHTML='✓ 書き直しOK！';
      input.disabled=true;
      window.setTimeout(function(){index++;showQuestion(true);},800);
    }else{
      feedback.innerHTML='もう一度入力してください。正解：<span class="answer">'+word+'</span>';
      input.select();
    }
  }
}

startBtn.onclick=beginQuiz;
document.getElementById('checkBtn').onclick=checkAnswer;
document.getElementById('speakBtn').onclick=speakCurrent;
document.getElementById('restartBtn').onclick=beginQuiz;
input.onkeydown=function(e){e=e||window.event;if(e.key==='Enter'||e.keyCode===13) checkAnswer();};
</script>
