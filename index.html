<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Bee</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(520px, 100%);
      background: white;
      border-radius: 18px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }
    .intro {
      margin: 0 0 28px;
      color: #555;
      line-height: 1.6;
    }
    .start {
      display: block;
      width: 100%;
      padding: 18px 16px;
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      background: #222;
      color: white;
      cursor: pointer;
      touch-action: manipulation;
    }
    .start:active {
      transform: scale(.99);
    }
    .notice {
      margin: 24px 0 0;
      padding: 14px 16px;
      border-radius: 10px;
      background: #f3f3f3;
      color: #555;
      font-size: .9rem;
      line-height: 1.6;
      text-align: left;
    }
  </style>
</head>
<body>
  <main>
    <h1>Spelling Bee</h1>
    <p class="intro">英単語のスペル練習を始めます。</p>

    <button class="start" type="button" onclick="openApp()">
      スタート
    </button>

    <p class="notice">
      ※LINEなどのアプリ内ブラウザでは、音声が再生されない場合があります。<br>
      音声が出ない場合は、SafariまたはChromeで開いてください。
    </p>
  </main>

  <script>
    function openApp() {
      location.href = "app.html?v=" + Date.now();
    }
  </script>
</body>
</html>
