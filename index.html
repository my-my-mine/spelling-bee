<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Bee</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(520px, 100%);
      background: white;
      border-radius: 18px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }
    p {
      margin: 0 0 28px;
      color: #555;
      line-height: 1.6;
    }
    .buttons {
      display: grid;
      gap: 16px;
    }
    a {
      display: block;
      padding: 18px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      background: #222;
      color: white;
      touch-action: manipulation;
    }
    a:active {
      transform: scale(.99);
    }
    .sub {
      display: block;
      margin-top: 5px;
      font-size: .85rem;
      font-weight: 400;
      opacity: .8;
    }
  </style>
</head>
<body>
  <main>
    <h1>Spelling Bee</h1>
    <p>使っている端末を選んでください。</p>

    <div class="buttons">
      <a href="apple.html?v=3">
        Mac / iPhone / iPad
        <span class="sub">Apple版</span>
      </a>

      <a href="android.html?v=2">
        Android
        <span class="sub">Android版</span>
      </a>
    </div>
  </main>
</body>
</html>
